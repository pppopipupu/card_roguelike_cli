[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "card-roguelike-cli"
version = "2.0.0"
description = "Headless DND 5.5E roguelike card game core with a single-action HTTP API"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.9",
    "pypinyin>=0.55",
    "orjson>=3.13",
    "msgspec>=0.19",
    "uvloop>=0.23; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pyright>=1.1",
]

[tool.pyright]
include = ["game", "server"]
exclude = ["**/__pycache__", ".venv", "scratch", "data", "deploy"]
typeCheckingMode = "standard"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
# 类型检查作为门禁，不保留任何推断豁免。
# 未定义名称、未绑定变量与导入解析始终报错。
reportOptionalSubscript = "error"
reportOptionalOperand = "error"
reportOperatorIssue = "error"
reportIndexIssue = "error"
reportCallIssue = "error"
reportGeneralTypeIssues = "error"
reportAssignmentType = "error"
reportReturnType = "error"

[project.scripts]
rogue-server = "server.app:run"

[tool.setuptools.packages.find]
include = ["game*", "server*"]
exclude = ["game.test*"]
