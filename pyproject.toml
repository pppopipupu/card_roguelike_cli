[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "card-roguelike-cli"
version = "2.0.0"
description = "Headless DND 5.5E roguelike card game core with a single-action HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[project.scripts]
rogue-server = "server.app:run"

[tool.setuptools.packages.find]
include = ["game*", "server*"]
