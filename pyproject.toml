[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "card-roguelike-cli"
version = "2.0.0"
description = "Headless DND 5.5E roguelike card game core with a single-action HTTP API"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.9",
    "pypinyin>=0.55",
    "orjson>=3.13",
    "msgspec>=0.19",
    "uvloop>=0.23; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pyright>=1.1",
]

[tool.pyright]
include = ["game", "server"]
exclude = ["**/__pycache__", ".venv", "scratch", "data", "deploy"]
typeCheckingMode = "basic"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
# 代码库大量使用无类型字典与动态属性，Basic 推断噪声不作为门禁；
# 保留未定义名称、未绑定变量与导入解析等会导致运行时失败的检查。
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportArgumentType = "none"
reportOptionalSubscript = "none"
reportOptionalOperand = "none"
reportOperatorIssue = "none"
reportIndexIssue = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportAssignmentType = "none"
reportReturnType = "none"

[project.scripts]
rogue-server = "server.app:run"

[tool.setuptools.packages.find]
include = ["game*", "server*"]
exclude = ["game.test*"]
